name: docs

on:
  # The docs site is static; redeploy when it (or the release notes it
  # reflects) changes on main. The rustdoc API reference is generated from
  # the crate sources, so `crates/**` and the workspace manifests count too.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Required by actions/deploy-pages: a `github-pages` environment with
    # the published URL.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify referenced docs exist
        run: |
          for f in $(grep -o 'href="[^"#]*\.md"' docs/index.html | sed 's/href="//;s/"//' | sort -u); do
            [ -f "$f" ] || { echo "docs/index.html references missing file: $f"; exit 1; }
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the API reference (rustdoc)
        run: cargo doc --workspace --no-deps

      - name: Stage the site (docs + /api/)
        run: |
          rm -rf site
          mkdir site
          cp -r docs/. site/
          cp -r target/doc site/api
          du -sh site site/api

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
