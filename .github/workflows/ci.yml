name: CI

on:
  # Runs on every pull request (before merge) AND on every push to main
  # (after merge). workflow_dispatch allows re-running on demand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is slower (ConPTY spawns + Gyan ffmpeg on a debug
          # build), so it gets a longer cap.
          - os: ubuntu-latest
            timeout: 30
          - os: macos-latest
            timeout: 45
          - os: windows-latest
            timeout: 60
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Best effort: the ffmpeg-dependent tests self-skip when ffmpeg
          # is absent, so a failed install must not fail the job. The
          # explicit `exit 0` matters: a failing native command leaves
          # $LASTEXITCODE set, which the runner would otherwise report.
          try {
            # winget >= 1.11 takes the package as a positional query.
            winget install -e --silent Gyan.FFmpeg --accept-source-agreements --accept-package-agreements
            # winget updates the *machine/user* PATH; refresh this session
            # so the rest of the job sees ffmpeg.
            $env:Path =
              [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
              [Environment]::GetEnvironmentVariable("Path", "User")
            Get-Command ffmpeg -ErrorAction Stop | Out-Null
            Write-Host "ffmpeg available"
          } catch {
            Write-Warning "ffmpeg unavailable - video-render tests will self-skip"
          }
          exit 0
      - run: cargo test --workspace
      # tmux/ffmpeg-dependent tests self-skip when the tool is absent, so a
      # platform that lacks one simply exercises the other paths.

  build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Verify binary runs
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/screendoc --version
      - name: Verify binary runs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./target/${{ matrix.target }}/release/screendoc.exe --version

  compile-cross:
    # The non-runner targets (32-bit and static-musl) are shipped as
    # release artifacts; a compile gate on every PR/push keeps them from
    # breaking.
    needs: [fmt]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check --workspace --target ${{ matrix.target }}

  audit:
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit + cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Supply-chain audit (RUSTSEC advisories)
        run: cargo audit
      - name: Dependency bans + license allowlist
        run: cargo deny check bans licenses
      - name: License audit (docs generator, allowlist)
        run: ./scripts/license-audit.sh --check

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y shellcheck
      - name: shellcheck every shell script
        run: shellcheck -S warning scripts/*.sh
      - name: bash syntax check
        run: for f in scripts/*.sh; do bash -n "$f"; done

  script-analysis-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer on the PowerShell installers
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path scripts/*.ps1 -Recurse
          if ($r) { $r | Format-Table | Out-String | Write-Host }
          if (($r | Where-Object Severity -eq 'Error').Count -gt 0) { exit 1 }

  docs-site:
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the docs site references only files that exist
        run: |
          for f in $(grep -o 'href="[^"#]*\.md"' docs/index.html | sed 's/href="//;s/"//' | sort -u); do
            [ -f "$f" ] || { echo "docs/index.html references missing file: $f"; exit 1; }
          done
          ls -l README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md docs/index.html
