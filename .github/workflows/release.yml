name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # SLSA provenance attestation (actions/attest-build-provenance) mints OIDC
  # tokens for the Sigstore identity system, and persists the result via the
  # attestations REST API, which the GITHUB_TOKEN must be able to write.
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # NOTE: expressions are NOT evaluated inside strategy blocks —
        # artifact names are explicit per entry.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: screendoc-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: screendoc-aarch64-unknown-linux-gnu.tar.gz
          # x86_64 macOS is CROSS-BUILT on the arm64 macos-latest runner:
          # macos-13 (the only Intel Mac) is chronically starved in the
          # runner queue and cannot be relied on to ever start. The SDK is
          # two-arch, so clang links x86_64 objects on an arm64 host. The
          # "Verify binary arch" step proves the artifact is really x86_64.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: screendoc-x86_64-apple-darwin.tar.gz
            extra_targets: x86_64-apple-darwin
            expect_arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: screendoc-aarch64-apple-darwin.tar.gz
            expect_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: screendoc-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup default stable

      - name: Install cross target
        if: matrix.extra_targets
        run: rustup target add ${{ matrix.extra_targets }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary arch
        if: runner.os == 'macOS' && matrix.expect_arch
        run: |
          BIN=target/${{ matrix.target }}/release/screendoc
          lipo -info "$BIN"
          archs=" $(lipo -archs "$BIN") "
          case "$archs" in
            *" ${{ matrix.expect_arch }} "*) echo "OK: artifact is ${{ matrix.expect_arch }}" ;;
            *) echo "FAIL: got '$archs', expected ${{ matrix.expect_arch }}" >&2; exit 1 ;;
          esac

      - name: Package (unix)
        id: package-unix
        if: runner.os != 'Windows'
        run: |
          BIN=target/${{ matrix.target }}/release/screendoc
          mkdir -p pkg/screendoc
          cp "$BIN" pkg/screendoc/screendoc
          cp LICENSE pkg/screendoc/
          (cd pkg && tar czf ../${{ matrix.artifact }} screendoc)
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          echo "sha256=$(sha256sum ${{ matrix.artifact }} | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Package (windows)
        id: package-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg/screendoc | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/screendoc.exe" pkg/screendoc/screendoc.exe
          Copy-Item LICENSE pkg/screendoc/
          Compress-Archive -Path pkg/screendoc -DestinationPath $env:Artifacts
          Set-Content -Path "$env:Artifacts.sha256" -Value (
            ("{0}  {1}" -f (Get-FileHash $env:Artifacts).Hash.ToLower(), [IO.Path]::GetFileName($env:Artifacts))
          )
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$((Get-FileHash $env:Artifacts).Hash.ToLower())"
        env:
          Artifacts: ${{ github.workspace }}/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

      # SLSA provenance: the attestation is bound to the artifact's exact
      # bytes (sha256 digest) and published alongside it; `gh attestation
      # verify` / Sigstore consumers can check WHO built WHAT and on WHICH
      # runner without trusting the release uploader.
      # Only one of package-unix / package-windows runs per matrix entry
      # (the other is skipped), so coalesce the two output slots.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.artifact }}
          subject-digest: sha256:${{ steps.package-unix.outputs.sha256 || steps.package-windows.outputs.sha256 }}

  static-musl:
    # Fully-static Linux binaries (no glibc dependency), for 64-bit and
    # 32-bit hosts alike: x86_64, i686 (x86-32), armv7 (ARM-32
    # hard-float), and aarch64 — the aarch64 static build is the one
    # Termux (Android) users install, since Termux has no glibc.
    # rust-lld links every target without host cross-gcc.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target links with rust-lld so the binary is fully static.
          # (x86_64 is no exception: host-gcc linking on the x86_64 runner
          # pulls in the glibc dynamic loader and `file` reports it as
          # "dynamically linked", failing the Verify static step.)
          - target: x86_64-unknown-linux-musl
            artifact: screendoc-x86_64-linux-musl.tar.gz
            rustflags: "-C target-feature=+crt-static -C linker=rust-lld"
          - target: i686-unknown-linux-musl
            artifact: screendoc-i686-linux-musl.tar.gz
            rustflags: "-C target-feature=+crt-static -C linker=rust-lld"
          - target: armv7-unknown-linux-musleabihf
            artifact: screendoc-armv7-linux-musleabihf.tar.gz
            rustflags: "-C target-feature=+crt-static -C linker=rust-lld"
          - target: aarch64-unknown-linux-musl
            artifact: screendoc-aarch64-linux-musl.tar.gz
            rustflags: "-C target-feature=+crt-static -C linker=rust-lld"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build static
        run: >
          RUSTFLAGS="${{ matrix.rustflags }}"
          cargo build --release --target ${{ matrix.target }}
      - name: Verify static
        run: |
          BIN=target/${{ matrix.target }}/release/screendoc
          file "$BIN"
          # A Linux binary is fully static iff it has no PT_INTERP segment.
          # (A static PIE — the x86_64 rust default — is fully static but
          # `file` calls it "static-pie linked", not "statically linked",
          # so the INTERP check is the authoritative test.)
          if readelf -lW "$BIN" | grep -q INTERP; then
            echo "ERROR: $BIN is dynamically linked (PT_INTERP present)" >&2
            exit 1
          fi
          echo "OK: $BIN is fully static (no PT_INTERP segment)"
      - name: Package
        id: package
        run: |
          mkdir -p pkg/screendoc-static
          cp target/${{ matrix.target }}/release/screendoc pkg/screendoc-static/
          (cd pkg && tar czf ../${{ matrix.artifact }} screendoc-static)
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          echo "sha256=$(sha256sum ${{ matrix.artifact }} | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.artifact }}
          subject-digest: sha256:${{ steps.package.outputs.sha256 }}

  distro:
    needs: [build, static-musl]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four distro packages, one per supported Linux arch:
          #   x86_64/aarch64 wrap the gnu (dynamic) tarballs;
          #   i686/armv7 wrap the fully-static musl tarballs (no 32-bit
          #   glibc distros exist on the runners, and static musl is the
          #   portable option there). Static packages carry no Depends:
          #   the binary is self-contained (ffmpeg stays an optional
          #   runtime tool, as with the tarballs).
          - arch: x86_64
            artifact: screendoc-x86_64-unknown-linux-gnu.tar.gz
            deb_arch: amd64
            depends: "bash, ffmpeg"
          - arch: aarch64
            artifact: screendoc-aarch64-unknown-linux-gnu.tar.gz
            deb_arch: arm64
            depends: "bash, ffmpeg"
          - arch: i686
            artifact: screendoc-i686-linux-musl.tar.gz
            deb_arch: i386
            depends: ""
          - arch: armv7
            artifact: screendoc-armv7-linux-musleabihf.tar.gz
            deb_arch: armhf
            depends: ""
    steps:
      - uses: actions/checkout@v7

      - name: Download the ${{ matrix.arch }} tarball
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Build .deb and .rpm packages
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          NAME=screendoc
          ARCH=${{ matrix.arch }}
          TARBALL=$(find dist -name "${{ matrix.artifact }}")
          echo "packaging ${TARBALL} at v${VERSION} for ${ARCH}"

          # --- .deb (dpkg-deb is preinstalled on the ubuntu runner) ---
          PKG=${NAME}-${VERSION}-${ARCH}-linux-deb
          mkdir -p "pkg/${PKG}/DEBIAN" "pkg/${PKG}/usr/local/bin"
          BIN=$(tar tzf "$TARBALL" | grep '/screendoc$' | head -1)
          test -n "$BIN"
          # Extract into usr/local/bin so the package installs
          # /usr/local/bin/screendoc, not /screendoc (the tarball's
          # top-level dir is stripped).
          tar xzf "$TARBALL" -C "pkg/${PKG}/usr/local/bin" --strip-components=1
          rm -f "pkg/${PKG}/usr/local/bin/LICENSE"
          {
            printf '%s\n' \
              "Package: ${NAME}" \
              "Version: ${VERSION}" \
              "Section: utils" \
              "Priority: optional" \
              "Architecture: ${{ matrix.deb_arch }}" \
              "Maintainer: ${NAME} Contributors"
            [ -n "${{ matrix.depends }}" ] && echo "Depends: ${{ matrix.depends }}"
            printf '%s\n' \
              "Description: Record terminal sessions and render them to GIF/MP4/WebM" \
              " ${NAME} records a command, a running shell, or tmux panes as an" \
              " asciinema-compatible event journal (raw byte stream plus command and" \
              " chapter markers) and renders it to GIF, MP4, WebM/AV1, still PNGs," \
              " and a self-contained HTML player."
          } > "pkg/${PKG}/DEBIAN/control"
          dpkg-deb --root-owner-group -b "pkg/${PKG}" "${NAME}-${VERSION}-${ARCH}-linux.deb"
          dpkg-deb --info "${NAME}-${VERSION}-${ARCH}-linux.deb"

          # --- .rpm (alien converts the verified .deb; output lands in CWD) ---
          sudo apt-get update -y
          sudo apt-get install -y alien
          alien -r "${NAME}-${VERSION}-${ARCH}-linux.deb"
          RPM=$(ls "${NAME}"-*.rpm)
          echo "built ${NAME}-${VERSION}-${ARCH}-linux.deb and ${RPM}"
          mv "${NAME}-${VERSION}-${ARCH}-linux.deb" dist/
          mv "$RPM" "dist/${NAME}-${VERSION}-${ARCH}-linux.rpm"

      - name: Upload distro artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distro-${{ matrix.arch }}
          path: |
            dist/screendoc-*-${{ matrix.arch }}-linux.deb
            dist/screendoc-*-${{ matrix.arch }}-linux.rpm

  publish:
    needs: [build, static-musl, distro]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Stage + combined SHA256SUMS
        run: |
          mkdir release && mv dist/*/* release/ 2>/dev/null || true
          # The release's public signing key ships as an asset so anyone
          # can verify the artifacts without needing the repo.
          cp PGP-KEY.asc release/
          (cd release && sha256sum *.tar.gz *.zip *.deb *.rpm > SHA256SUMS)
          for f in release/*; do echo "  - $f"; done

      - name: Generate SBOM (CycloneDX 1.6)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-sbom --version 0.10.0
          cargo +stable sbom --output-format cyclone_dx_json_1_6 > release/SBOM.json
          python3 -c 'import json; d=json.load(open("release/SBOM.json")); print("OK: SBOM spec", d["specVersion"], "components:", len(d.get("components", [])))'
          cd release && sha256sum SBOM.json >> SHA256SUMS
        env:
          CARGO_TERM_COLOR: always

      # Enterprise supply-chain control: when the repo secret
      # SDOC_RELEASE_SIGNING_KEY (private GPG key) is configured, every
      # artifact and the checksum manifest are detached-signed; `install.sh`
      # and distro packagers can then verify the release.
      - name: Sign artifacts (when SDOC_RELEASE_SIGNING_KEY is set)
        env:
          SDOC_RELEASE_SIGNING_KEY: ${{ secrets.SDOC_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$SDOC_RELEASE_SIGNING_KEY" ] || { echo "no signing key configured — skipping"; exit 0; }
          set -euo pipefail
          gpg --batch --import <<<"$SDOC_RELEASE_SIGNING_KEY"
          cd release
          # gpg 2.4 (the runner's version) is broken for multi-file
          # `--detach-sign`: it only signs the LAST input file, and even that
          # signature fails verification (reproduced locally with gpg 2.4.8).
          # Sign each file explicitly in a loop instead, armored, and
          # self-verify every signature before publishing.
          for f in *.tar.gz *.zip *.deb *.rpm SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback --armor --digest-algo SHA512 \
              --detach-sign "$f"
          done
          for f in *.tar.gz *.zip *.deb *.rpm SHA256SUMS; do
            gpg --batch --verify "$f.asc" "$f"
          done
          ls *.asc

      - name: Publish release
        run: |
          set -euo pipefail
          cd release
          TAG="${GITHUB_REF#refs/tags/}"
          [ -n "$TAG" ] && [ "$TAG" != "${GITHUB_REF}" ] \
            || { echo "FAIL: GITHUB_REF=${GITHUB_REF} did not strip to a tag name" >&2; exit 1; }
          echo "Publishing tag: $TAG"
          # Idempotent: clear ALL prior releases for this tag (drafts included)
          # from failed runs, so a re-run cannot trip over its own leftovers.
          # The by-tag DELETE only clears non-drafts, so sweep by release id.
          for RID in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | python3 -c 'import json,sys; [print(r["id"]) for r in json.load(sys.stdin) if r["tag_name"]==sys.argv[1]]' "$TAG" 2>/dev/null || true); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${RID}" >/dev/null 2>&1 || true
          done
          # Create the release explicitly (and retry once: right after a tag
          # re-point, the API can briefly reject the ref with 422
          # "tag_name is not well-formed").
          POST() {
            gh api -X POST --input <(printf \
              '{"draft":false,"prerelease":false,"tag_name":"%s","name":"screendoc %s","body":"See CHANGELOG.md"}' \
              "$TAG" "$TAG") "repos/${GITHUB_REPOSITORY}/releases"
          }
          OUT=$(POST) || { sleep 10; OUT=$(POST); }
          RELEASE_ID=$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "Release id: $RELEASE_ID"
          # Asset uploads must target uploads.github.com (the release's
          # upload_url); POSTing to api.github.com/.../releases/{id}/assets
          # returns 404.
          for f in *; do
            curl -sf -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${f}"
            echo "uploaded ${f}"
          done
          gh api --jq .html_url "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The in-repo formula at tag time always points at the PREVIOUS release
      # (one-release-behind invariant). After publishing, backfill main with
      # the version + checksums just released so `brew install` tracks the
      # newest tag.
      - name: Backfill the homebrew formula on main
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          sha() { awk '{print $1}' "release/$1.sha256"; }
          DARWIN_ARM_SHA=$(sha screendoc-aarch64-apple-darwin.tar.gz)
          DARWIN_X86_SHA=$(sha screendoc-x86_64-apple-darwin.tar.gz)
          LINUX_ARM_SHA=$(sha screendoc-aarch64-unknown-linux-gnu.tar.gz)
          LINUX_X86_SHA=$(sha screendoc-x86_64-unknown-linux-gnu.tar.gz)
          printf '%s\n' \
            'class Screendoc < Formula' \
            '  desc "Record your terminal and publish it as GIF, MP4, asciinema cast, and web player"' \
            '  homepage "https://github.com/GlobalTechInfo/screendoc"' \
            '  # Keep this in sync with the latest release. The release' \
            '  # workflow backfills this file on main after every tagged' \
            '  # release, so the formula on main is always one release' \
            '  # behind the newest tag.' \
            "  version \"${VERSION}\"" \
            '' \
            '  livecheck do' \
            '    url "https://api.github.com/repos/GlobalTechInfo/screendoc/releases/latest"' \
            '    regex(/v?([0-9]+\.[0-9]+\.[0-9]+)/i)' \
            '  end' \
            '' \
            '  on_macos do' \
            '    if Hardware::CPU.arm?' \
            "      url \"https://github.com/GlobalTechInfo/screendoc/releases/download/v#{version}/screendoc-aarch64-apple-darwin.tar.gz\"" \
            "      sha256 \"${DARWIN_ARM_SHA}\"" \
            '    else' \
            "      url \"https://github.com/GlobalTechInfo/screendoc/releases/download/v#{version}/screendoc-x86_64-apple-darwin.tar.gz\"" \
            "      sha256 \"${DARWIN_X86_SHA}\"" \
            '    end' \
            '  end' \
            '' \
            '  on_linux do' \
            '    if Hardware::CPU.aarch64?' \
            "      url \"https://github.com/GlobalTechInfo/screendoc/releases/download/v#{version}/screendoc-aarch64-unknown-linux-gnu.tar.gz\"" \
            "      sha256 \"${LINUX_ARM_SHA}\"" \
            '    else' \
            "      url \"https://github.com/GlobalTechInfo/screendoc/releases/download/v#{version}/screendoc-x86_64-unknown-linux-gnu.tar.gz\"" \
            "      sha256 \"${LINUX_X86_SHA}\"" \
            '    end' \
            '  end' \
            '' \
            '  def install' \
            '    bin.install "screendoc"' \
            '  end' \
            '' \
            '  test do' \
            '    system "#{bin}/screendoc", "--version"' \
            '  end' \
            'end' > packaging/homebrew/screendoc.rb
          CURRENT_SHA=$(gh api --jq '.sha // empty' \
            "repos/${GITHUB_REPOSITORY}/contents/packaging/homebrew/screendoc.rb?ref=main" || true)
          CURRENT_B64=$(gh api --jq '.content // empty' \
            "repos/${GITHUB_REPOSITORY}/contents/packaging/homebrew/screendoc.rb?ref=main" || true)
          if [ -n "$CURRENT_B64" ] && \
             [ "$(printf '%s' "$CURRENT_B64" | tr -d '\n' | base64 -d)" = "$(cat packaging/homebrew/screendoc.rb)" ]; then
            echo "Formula on main already matches ${TAG}; skipping backfill."
            exit 0
          fi
          python3 - "$TAG" "$CURRENT_SHA" <<'PY' > /tmp/formula-put.json
          import base64, json, sys
          tag, sha = sys.argv[1], sys.argv[2]
          content = open("packaging/homebrew/screendoc.rb", "rb").read()
          body = {
              "message": f"chore(formula): backfill homebrew formula to {tag}",
              "content": base64.b64encode(content).decode(),
              "branch": "main",
          }
          if sha:
              body["sha"] = sha
          print(json.dumps(body))
          PY
          gh api -X PUT \
            "repos/${GITHUB_REPOSITORY}/contents/packaging/homebrew/screendoc.rb" \
            --input /tmp/formula-put.json
          echo "Backfilled homebrew formula on main to ${TAG}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
