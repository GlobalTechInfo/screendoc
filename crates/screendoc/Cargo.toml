[package]
name = "screendoc"
description = "Record your terminal, annotate it, and publish it as GIF/MP4/asciinema/web player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "screendoc"
path = "src/lib.rs"

[[bin]]
name = "screendoc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "=4.6.11"
dirs = "=7.0.0"
serde_json = "=1.0.154"
sdoc-core = { path = "../sdoc-core" }
sdoc-record = { path = "../sdoc-record" }
sdoc-render = { path = "../sdoc-render" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
toml = "=1.2.1"
webbrowser = "=1.2.6"

[dev-dependencies]
flate2 = "=1.1.11"
tempfile = "=3.27.0"
