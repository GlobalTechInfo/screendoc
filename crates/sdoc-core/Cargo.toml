[package]
name = "sdoc-core"
description = "screendoc core: event model, session storage, asciinema cast writing, marker demuxing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

 [dependencies]
 aes-gcm = "=0.10.3"
 dirs = "=7.0.0"
 flate2 = "=1.1.11"
 generic-array = "=0.14.7"
 getrandom = "=0.3.3"
 regex = "=1.13.1"
 serde = { version = "=1.0.229", features = ["derive"] }
 serde_json = "=1.0.154"
 thiserror = "=2.0.21"
 toml = "=1.2.1"

 # Cross-platform Ctrl-C: on Unix, signal-hook's flag handler is
 # thread-free and signal-safe (no valgrind findings); on Windows the
 # equivalent is ctrlc.
 [target.'cfg(unix)'.dependencies]
 signal-hook = "=0.4.6"

 [target.'cfg(windows)'.dependencies]
 ctrlc = "=3.4.2"

[dev-dependencies]
tempfile = "=3.27.0"
